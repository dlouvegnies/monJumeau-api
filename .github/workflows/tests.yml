name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio respx

      - name: Lancer les tests
        run: pytest tests/ -v
